name: Build Pharmacy PMS for Windows

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Enable Yarn
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build frontend
        run: npm run build:frontend

      - name: Build Windows installer
        run: npm run dist:win

      - name: Verify installer
        shell: powershell
        run: |
          $installer = "packages/electron/release/Pharmacy PMS Setup 1.0.0.exe"

          if (-not (Test-Path $installer)) {
            Write-Error "Installer was not created: $installer"
            exit 1
          }

          $file = Get-Item $installer

          Write-Host "Installer created successfully:"
          Write-Host $file.FullName
          Write-Host "Size: $([math]::Round($file.Length / 1MB, 2)) MB"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pharmacy-PMS-Windows-Installer
          path: packages/electron/release/Pharmacy PMS Setup 1.0.0.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/electron/release/Pharmacy PMS Setup 1.0.0.exe
          generate_release_notes: true
          fail_on_unmatched_files: true